scalar AWSDateTime

enum RescueStatus {
  PENDING
  ASSIGNED
  COMPLETED
  CANCELLED
}

type OrganisationDirectoryEntry {
  id: ID!
  authorityId: ID!
  jurisdiction: String!
  officialName: String!
  displayName: String!
  areaDescription: String!
  speciesSpeciality: String!
  boundaryStatus: String!
  aliases: [String!]!
  sourceType: String!
  sourceUrl: String!
  sourceUpdatedAt: String!
}

type OrganisationConnection {
  items: [OrganisationDirectoryEntry!]!
  nextToken: String
}

type Rescue {
  id: ID!
  organisationId: ID
  type: String!
  breed: String
  location: String
  latitude: Float!
  longitude: Float!
  injury: String
  status: RescueStatus!
  assignedUserId: ID
  pickedUpAt: AWSDateTime
  transportAnimalId: ID
  transportSourceRescueId: ID
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type RescueConnection {
  items: [Rescue!]!
  nextToken: String
}

input CreateRescueInput {
  id: ID!
  organisationId: ID
  type: String!
  breed: String
  location: String
  latitude: Float!
  longitude: Float!
  injury: String
  status: RescueStatus = PENDING
}

input UpdateRescueStatusInput {
  id: ID!
  status: RescueStatus!
}

type Query {
  organisation(id: ID!): OrganisationDirectoryEntry
  organisations(limit: Int = 100, nextToken: String): OrganisationConnection!
  rescue(id: ID!): Rescue
  rescues(status: RescueStatus, limit: Int = 50, nextToken: String): RescueConnection!
}

type Mutation {
  createRescue(input: CreateRescueInput!): Rescue!
  updateRescueStatus(input: UpdateRescueStatusInput!): Rescue!
}

schema {
  query: Query
  mutation: Mutation
}
