name: Rescue Hub realtime type and Svelte validation

on:
  push:
    branches:
      - feature/guided-animal-pickup-demo-base
      - deploy/rescue-demo-domain
      - fix/confirm-invitation-password
      - fix/reinvite-removed-email-lookup
      - feature/invitation-delivery-tracking-and-email-correction
      - fix/chat-enter-send-and-removed-members
      - fix/rescuer-ownership-and-simple-vet-handover
      - feature/desktop-account-settings-and-rescue-assignees
      - fix/chat-admin-layout-and-species-mobile-feed
      - feature/rescue-addresses-and-directions
      - fix/unified-public-phone-dispatch-and-topbar
      - feature/demo-rescue-lifecycle-histories
      - fix/unified-workspace-navigation-and-theme-contrast
      - fix/member-scope-and-invitation-role-management
      - feature/one-click-organisation-invitations
      - feature/portal-role-documentation
      - fix/mapbox-geographic-pin-anchoring
      - fix/keyboard-occlusion-native-geometry
      - fix/platform-admin-chat-organisation-oversight
      - fix/expo-keyboard-focus-visibility
      - feature/organisation-group-chats
      - feature/carer-self-claim-transport-to-me
      - feature/animal-care-map-lifecycle
      - fix/dispatch-self-claim-and-phone-updates
      - fix/public-reporter-email-validation
      - fix/use-mapbox-geolocate-control
      - feature/public-gps-routing-and-contact
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: npm install --no-audit --no-fund
      - name: Single-use organisation invitation link tests
        run: node --experimental-strip-types --test packages/core/invitation-links.test.mjs
      - name: Invitation password confirmation checks
        run: node --experimental-strip-types --test packages/core/invitation-password.test.mjs
      - name: Public reporter signup and email verification validation tests
        run: node --experimental-strip-types --test packages/core/public-reporter-validation.test.mjs
      - name: Geographic rescue pin anchoring tests
        run: node --experimental-strip-types --test packages/core/rescue-pin-geojson.test.mjs
      - name: Keyboard occlusion geometry regression tests
        run: node --experimental-strip-types --test packages/core/keyboard-geometry.test.mjs
      - name: Organisation chat membership and validation tests
        run: node --experimental-strip-types --test packages/core/chat-channels.test.mjs
      - name: Operational map lifecycle validation tests
        run: node --experimental-strip-types --test packages/core/case-map-visibility.test.mjs
      - name: Desktop rescue visibility tests
        run: node --experimental-strip-types --test packages/core/desktop-dispatch-access.test.mjs
      - name: Role assignment and administrator privilege boundary tests
        run: node --experimental-strip-types --test packages/core/portal-admin-roles.test.mjs
      - name: Independent care claim and delivery tests
        run: node --experimental-strip-types --test packages/core/care-delivery.test.mjs
      - name: Animal telephone update validation tests
        run: node --experimental-strip-types --test packages/core/rescue-phone-update.test.mjs
      - name: GIS routing unit tests
        run: node --experimental-strip-types --test packages/core/operating-area-routing.test.mjs
      - name: AppSync websocket protocol test
        run: node --experimental-strip-types --test packages/core/realtime-client.test.mjs
      - name: Workspace visual consistency regression checks
        run: node --test packages/core/workspace-appearance.test.mjs
      - name: Demo rescue story consistency and fixture integrity
        run: node --experimental-strip-types --test packages/core/demo-rescue-stories.test.mjs
      - name: Unified public intake channel tests
        run: node --experimental-strip-types --test packages/core/report-channel.test.mjs
      - name: Rescue address and coordinate directions safety tests
        run: node --experimental-strip-types --test packages/core/rescue-location.test.mjs
      - name: Rescue species mapping and specialist eligibility tests
        run: node --experimental-strip-types --test packages/core/dispatch-species.test.mjs
      - name: Realtime mobile feed reconciliation tests
        run: node --experimental-strip-types --test packages/core/rescue-feed-reconciliation.test.mjs
      - name: Assigned rescuer and simple vet handover regression tests
        run: node --experimental-strip-types --test packages/core/field-rescue-progress.test.mjs
      - name: Chat composer keyboard regression tests
        run: node --experimental-strip-types --test packages/core/chat-composer-keyboard.test.mjs
      - name: SES invitation status regression tests
        run: node --experimental-strip-types --test packages/core/invitation-delivery.test.mjs
      - name: Removed and pending invitation email re-use regression tests
        run: node --experimental-strip-types --test packages/core/invite-email-resolution.test.mjs
      - name: Activation form Origin/CSRF policy regression test
        run: node --test packages/core/activation-origin.test.mjs
      - name: TypeScript and warning-free Svelte checks
        run: npm run check
      - name: React Native TypeScript validation
        run: npm run check --workspace=@rescue-hub/mobile
      - name: Production SvelteKit bundle (dummy SST links for CI only)
        env:
          SST_RESOURCE_RescueHubData: '{"name":"ci-placeholder-table"}'
          SST_RESOURCE_RescueHubGraphQL: '{"url":"https://example.invalid/graphql","apiKey":"ci-placeholder"}'
          SST_RESOURCE_RescueHubRealtime: '{"url":"https://example.appsync-api.ap-southeast-2.amazonaws.com/graphql","apiKey":"ci-placeholder"}'
          SST_RESOURCE_RescueHubMailFrom: '{"value":"ci@example.invalid"}'
        run: npm run build --workspace=website
