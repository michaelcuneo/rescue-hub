name: AWS-native geocoding checks

on:
  push:
    branches: [feature/provider-independent-geocoding]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geocoding-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Geocoding parsing and GPS safety
        run: node --experimental-strip-types --test packages/core/geocoding.test.mjs packages/core/rescue-location.test.mjs

  svelte-and-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install workspaces
        run: npm install --no-audit --no-fund
      # Temporary diagnostic: generate the exact dependency lock patch
      # from the npm registry used by CI for a reproducible local install.
      - name: Report pinned MapLibre lockfile changes
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const original = JSON.parse(cp.execFileSync('git', ['show', 'HEAD:package-lock.json'], { encoding: 'utf8' }));
          const updated = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const changes = Object.fromEntries(Object.entries(updated.packages).filter(([key, value]) =>
            JSON.stringify(value) !== JSON.stringify(original.packages[key])));
          const encoded = Buffer.from(JSON.stringify(changes)).toString('base64');
          for (let index = 0, n = 0; index < encoded.length; index += 2000, n++) {
            console.log('RH_LOCK_PATCH_' + n + '_' + encoded.slice(index, index + 2000));
          }
          console.log('RH_LOCK_PATCH_COUNT_' + Math.ceil(encoded.length / 2000));
          NODE
      - name: Svelte and React Native type checks
        run: npm run check
      - name: Build SvelteKit (dummy SST resources only)
        env:
          SST_RESOURCE_RescueHubData: '{"name":"ci-placeholder-table"}'
          SST_RESOURCE_RescueHubGeocodingCache: '{"name":"ci-geocode-cache"}'
          SST_RESOURCE_RescueHubGraphQL: '{"url":"https://example.invalid/graphql","apiKey":"ci-placeholder"}'
          SST_RESOURCE_RescueHubRealtime: '{"url":"https://example.appsync-api.ap-southeast-2.amazonaws.com/graphql","apiKey":"ci-placeholder"}'
          SST_RESOURCE_RescueHubMailFrom: '{"value":"ci@example.invalid"}'
        run: npm run build --workspace=website
