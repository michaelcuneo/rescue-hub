name: Validate modernization

on:
  push:
    branches:
      - chore/modernize-sveltekit-2026
  workflow_dispatch:

concurrency:
  group: rescue-hub-modernization
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type and Svelte checks
        run: npm run check

      - name: Build all applications
        run: npm run build
