name: Validate modernization

on:
  push:
    branches:
      - chore/modernize-sveltekit-2026
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: chore/modernize-sveltekit-2026
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and refresh lockfile
        run: npm install

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh package lock [skip ci]"
            git push
          fi

      - name: Type and Svelte checks
        run: npm run check

      - name: Build all applications
        run: npm run build
